# electron-builder設定。
# Windows向けインストーラーを作れるようにするための設定のみ（実際のビルド実行は対象外）。
appId: com.itindex.app
productName: IT-Index
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
  - package.json
extraMetadata:
  main: dist-electron/main.js
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
