<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover … ノッチ／ジェスチャーバーの領域まで描画し、余白はCSSの env(safe-area-inset-*) で制御する
      interactive-widget=resizes-content … ソフトキーボードが出たときにレイアウトを縮める（内容に被せない）
      拡大は意図的に禁止しない（user-scalable=no は弱視の利用者を締め出すため使わない）
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!--
      CSP。connect-srcは3種のAIプロバイダ・Google Drive/GIS（休眠中機能）・Google Fontsのみ許可する。
      サーバーレスの静的ホスティングのためHTTPヘッダーでの付与ができず、metaタグで代用する（#34対応）。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data:;
        connect-src 'self' https://api.anthropic.com https://api.openai.com https://generativelanguage.googleapis.com https://www.googleapis.com https://accounts.google.com;
        frame-src https://accounts.google.com;
        object-src 'none';
        base-uri 'self';
        form-action 'self';"
    />
    <title>IT-Index</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
