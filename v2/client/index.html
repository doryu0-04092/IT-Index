<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover … ノッチ／ジェスチャーバーの領域まで描画し、余白はCSSのenv(safe-area-inset-*)で制御する
      interactive-widget=resizes-content … ソフトキーボードが出たときにレイアウトを縮める(内容に被せない)
      v1(../../index.html:10-13)準拠。拡大は意図的に禁止しない(user-scalable=noは弱視の利用者を締め出すため使わない)
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>IT-Index</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
